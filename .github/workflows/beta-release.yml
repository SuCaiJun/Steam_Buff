name: Beta 自动构建与发布

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-buff-beta-release
  cancel-in-progress: false

jobs:
  publish-beta:
    name: 构建并更新 Beta Release
    if: github.ref == 'refs/heads/beta'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 检出完整 Beta 历史
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装并定位 Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chrome = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if (-not $chrome) {
            choco install googlechrome --no-progress -y
            $chrome = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          }
          if (-not $chrome) {
            throw "找不到 Chrome，无法生成 CRX。"
          }
          "STEAM_BUFF_CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 获取主分支基线
        shell: pwsh
        run: git fetch origin main --prune

      - name: 读取当前版本
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -LiteralPath manifest.json -Raw | ConvertFrom-Json
          $version = ([string]$manifest.version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "manifest.json 版本号不是三段式版本：$version"
          }
          "STEAM_BUFF_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 生成累计 Beta 更新日志
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File .github/scripts/generate-release-notes.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -BaseRef origin/main `
            -HeadRef $env:GITHUB_SHA `
            -OutputPath "$env:RUNNER_TEMP\steam-buff-beta-notes.md" `
            -Version $env:STEAM_BUFF_VERSION `
            -Channel beta

      - name: 构建两个 Beta 压缩包
        shell: pwsh
        env:
          STEAM_BUFF_PEM_BASE64: ${{ secrets.STEAM_BUFF_PEM_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File .github/scripts/build-release-artifacts.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory "$env:RUNNER_TEMP\steam-buff-beta-artifacts" `
            -Version $env:STEAM_BUFF_VERSION `
            -Channel beta `
            -ChromePath $env:STEAM_BUFF_CHROME_PATH

      - name: 更新唯一 Beta Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File .github/scripts/github-release.ps1 `
            -Action Publish `
            -Tag beta `
            -Name "Beta" `
            -BodyPath "$env:RUNNER_TEMP\steam-buff-beta-notes.md" `
            -AssetDirectory "$env:RUNNER_TEMP\steam-buff-beta-artifacts" `
            -TargetCommit $env:GITHUB_SHA `
            -Prerelease
