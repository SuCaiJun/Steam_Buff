name: Mirror GitHub to Gitee

on:
  workflow_call:
    inputs:
      release_tag:
        description: 正式 GitHub Release 标签，例如 v1.0.24
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 正式 GitHub Release 标签，例如 v1.0.24
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-formal-github-to-gitee
  cancel-in-progress: false

env:
  GITEE_REPOSITORY: sys1em/Steam_Buff
  GITEE_USER: sys1em

jobs:
  mirror-git:
    name: 同步正式 Git refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出正式分支和标签
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: 同步 main 和正式标签到 Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN"

          github_refs="$RUNNER_TEMP/github.refs"
          gitee_refs="$RUNNER_TEMP/gitee.refs"
          push_specs="$RUNNER_TEMP/gitee.push-specs"

          encoded_token="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITEE_TOKEN"], safe=""))')"
          gitee_push_url="https://${GITEE_USER}:${encoded_token}@gitee.com/${GITEE_REPOSITORY}.git"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1
          export GIT_HTTP_LOW_SPEED_TIME=30

          git update-ref -d refs/remotes/origin/HEAD || true
          : > "$push_specs"
          : > "$github_refs"

          while read -r object ref; do
            branch="${ref#refs/remotes/origin/}"
            if [[ "$branch" != "main" ]]; then
              continue
            fi
            printf '%s:%s\n' "$ref" "refs/heads/$branch" >> "$push_specs"
            printf '%s refs/heads/%s\n' "$object" "$branch" >> "$github_refs"
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin)

          while read -r object ref; do
            tag="${ref#refs/tags/}"
            if [[ "$tag" != v* ]]; then
              continue
            fi
            printf '%s:%s\n' "$ref" "refs/tags/$tag" >> "$push_specs"
            printf '%s refs/tags/%s\n' "$object" "$tag" >> "$github_refs"
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/tags)

          sort -o "$github_refs" "$github_refs"
          mapfile -t push_refspecs < "$push_specs"
          if [[ "${#push_refspecs[@]}" -eq 0 ]]; then
            echo "没有可同步的正式分支或标签。" >&2
            exit 1
          fi
          timeout 600s git push --force "$gitee_push_url" "${push_refspecs[@]}"

          timeout 30s git ls-remote --heads --tags "$gitee_push_url" |
            awk '{ print $1 " " $2 }' | sort > "$gitee_refs"

          mapfile -t stale_refs < <(comm -23 \
            <(awk '{ print $2 }' "$gitee_refs" | sort) \
            <(awk '{ print $2 }' "$github_refs" | sort))
          if [[ "${#stale_refs[@]}" -gt 0 ]]; then
            delete_refspecs=()
            for ref in "${stale_refs[@]}"; do
              delete_refspecs+=(":$ref")
            done
            timeout 600s git push "$gitee_push_url" "${delete_refspecs[@]}"
          fi

          timeout 30s git ls-remote --heads --tags "$gitee_push_url" |
            awk '{ print $1 " " $2 }' | sort > "$gitee_refs"
          diff -u "$github_refs" "$gitee_refs"

  mirror-release:
    name: 同步正式 Release 和附件
    needs: mirror-git
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: 检出正式分支脚本
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: 下载并验证正式 Release 附件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "拒绝同步非正式标签：$RELEASE_TAG" >&2
            exit 1
          fi
          asset_directory="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_directory"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$asset_directory" \
            --clobber
          zip_count="$(find "$asset_directory" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          if [[ "$zip_count" != "2" ]]; then
            echo "正式 Release 必须包含两个 zip 附件，实际为 $zip_count 个。" >&2
            exit 1
          fi
          test -f "$asset_directory/SteamBuff_${RELEASE_TAG#v}_Release.zip"
          test -f "$asset_directory/SteamBuff_${RELEASE_TAG#v}_SourceCode.zip"

      - name: 获取并验证正式 Release 元数据
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_PATH: ${{ runner.temp }}/github-release-event.json
        run: |
          $ErrorActionPreference = "Stop"
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "无法读取正式 GitHub Release：$env:RELEASE_TAG"
          }
          $release = $json | ConvertFrom-Json
          if ([string]$release.tag_name -ne $env:RELEASE_TAG) {
            throw "GitHub Release 标签不一致。"
          }
          if ([bool]$release.draft -or [bool]$release.prerelease) {
            throw "拒绝同步草稿或预发布 Release：$env:RELEASE_TAG"
          }
          $event = @{ release = $release } | ConvertTo-Json -Depth 20
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($env:RELEASE_EVENT_PATH, $event, $utf8NoBom)

      - name: 调用 Gitee 正式 Release 同步服务
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          EVENT_PATH: ${{ runner.temp }}/github-release-event.json
        run: |
          $ErrorActionPreference = "Stop"
          .github/scripts/sync-gitee-release.ps1 `
            -EventPath $env:EVENT_PATH `
            -AssetDirectory "$env:RUNNER_TEMP\release-assets" `
            -EventAction "published"
