name: Mirror GitHub to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  release:
    types:
      - published
      - edited
      - deleted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-github-to-gitee
  cancel-in-progress: false

env:
  GITEE_REPOSITORY: sys1em/Steam_Buff
  GITEE_USER: sys1em

jobs:
  mirror-git:
    name: Mirror branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all GitHub refs
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mirror Git refs to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN"

          github_refs="$RUNNER_TEMP/github.refs"
          gitee_refs="$RUNNER_TEMP/gitee.refs"
          push_specs="$RUNNER_TEMP/gitee.push-specs"

          encoded_token="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITEE_TOKEN"], safe=""))')"
          gitee_push_url="https://${GITEE_USER}:${encoded_token}@gitee.com/${GITEE_REPOSITORY}.git"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1
          export GIT_HTTP_LOW_SPEED_TIME=30

          git update-ref -d refs/remotes/origin/HEAD || true
          : > "$push_specs"
          : > "$github_refs"
          while read -r object ref; do
            branch="${ref#refs/remotes/origin/}"
            if [[ "$branch" == "HEAD" || "$branch" == "beta" ]]; then
              continue
            fi
            printf '%s:%s\n' "$ref" "refs/heads/$branch" >> "$push_specs"
            printf '%s refs/heads/%s\n' "$object" "$branch" >> "$github_refs"
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin)

          while read -r object ref; do
            tag="${ref#refs/tags/}"
            if [[ "$tag" == "beta" ]]; then
              continue
            fi
            printf '%s:%s\n' "$ref" "refs/tags/$tag" >> "$push_specs"
            printf '%s refs/tags/%s\n' "$object" "$tag" >> "$github_refs"
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/tags)

          sort -o "$github_refs" "$github_refs"
          mapfile -t push_refspecs < "$push_specs"
          if [[ "${#push_refspecs[@]}" -eq 0 ]]; then
            echo "没有可同步的正式分支或标签。" >&2
            exit 1
          fi
          timeout 600s git push --force "$gitee_push_url" "${push_refspecs[@]}"

          # Normalize git ls-remote's tab-separated output before comparing refs.
          timeout 30s git ls-remote --heads --tags "$gitee_push_url" |
            awk '{ print $1 " " $2 }' | sort > "$gitee_refs"

          mapfile -t stale_refs < <(comm -23 \
            <(awk '{ print $2 }' "$gitee_refs" | sort) \
            <(awk '{ print $2 }' "$github_refs" | sort))
          if [[ "${#stale_refs[@]}" -gt 0 ]]; then
            delete_refspecs=()
            for ref in "${stale_refs[@]}"; do
              delete_refspecs+=(":$ref")
            done
            timeout 600s git push "$gitee_push_url" "${delete_refspecs[@]}"
          fi

          timeout 30s git ls-remote --heads --tags "$gitee_push_url" |
            awk '{ print $1 " " $2 }' | sort > "$gitee_refs"
          diff -u "$github_refs" "$gitee_refs"

  mirror-release:
    name: Mirror release metadata and assets
    if: >-
      github.event_name == 'release' &&
      (github.event.action == 'deleted' ||
       (github.event.release.tag_name != 'beta' && github.event.release.prerelease != true))
    needs: mirror-git
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release sync script
        uses: actions/checkout@v5

      - name: Download GitHub Release assets
        if: github.event.action != 'deleted' && github.event.release.tag_name != 'beta'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets" \
            --clobber

      - name: Create or update Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          .github/scripts/sync-gitee-release.ps1 `
            -EventPath $env:GITHUB_EVENT_PATH `
            -AssetDirectory "$env:RUNNER_TEMP/release-assets" `
            -EventAction "${{ github.event.action }}"
